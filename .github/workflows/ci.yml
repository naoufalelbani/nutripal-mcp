name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test and typecheck (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 24]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Typecheck
        run: bun run typecheck

      - name: Build Node.js output
        run: bun run build

      - name: Check Node.js launcher
        run: |
          node bin/nutripal-mcp.js --help
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' |
            node bin/nutripal-mcp.js |
            node -e 'let text = ""; process.stdin.on("data", (chunk) => text += chunk); process.stdin.on("end", () => { const response = JSON.parse(text); if (response.result?.serverInfo?.name !== "nutripal-mcp") process.exit(1); });'

      # Fails the build if the published tarball would contain surprises.
      - name: Verify package contents
        run: npm pack --dry-run
