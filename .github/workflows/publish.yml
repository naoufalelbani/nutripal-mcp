name: Publish to npm

# Publishing is driven by a GitHub Release. Creating or publishing a release
# tagged v1.2.3 publishes the version in package.json to npm.
#
# Requires the npm package's trusted publisher to point to this workflow.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # needed for npm provenance attestations

# Never publish twice at once, and never interrupt a publish in progress.
concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # npm publish builds Node.js bundles through prepublishOnly.
      - name: Set up Node for npm
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Require release tag to match package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$RELEASE_TAG" != "v$VERSION" ]; then
            echo "Release tag $RELEASE_TAG does not match package version v$VERSION" >&2
            exit 1
          fi

      - name: Run tests
        run: bun test

      - name: Typecheck
        run: bun run typecheck

      - name: Build and check Node.js launcher
        run: |
          bun run build
          node bin/nutripal-mcp.js --help
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"release","version":"0"}}}' |
            node bin/nutripal-mcp.js |
            node -e 'let text = ""; process.stdin.on("data", (chunk) => text += chunk); process.stdin.on("end", () => { const response = JSON.parse(text); if (response.result?.serverInfo?.name !== "nutripal-mcp") process.exit(1); });'

      # Re-running a workflow must not fail on a version that already shipped.
      - name: Check whether this version is already on npm
        id: npm-check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "Checking ${NAME}@${VERSION}"
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${NAME}@${VERSION} is already published. Nothing to do."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.npm-check.outputs.already != 'true'
        run: npm publish --access public

      - name: Report published version
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "Published ${NAME}@${VERSION} to https://www.npmjs.com/package/${NAME}"
