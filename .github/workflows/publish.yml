name: Publish to npm

# Publishing is driven by a GitHub Release. Creating or publishing a release
# tagged v1.2.3 publishes the version in package.json to npm.
#
# Requires one repository secret:
#   NPM_TOKEN  - an npm automation token with publish rights for this package
#                (npmjs.com -> Access Tokens -> Generate New Token -> Automation)

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # needed for npm provenance attestations

# Never publish twice at once, and never interrupt a publish in progress.
concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Node is only needed for the npm CLI itself; the project runs on Bun.
      - name: Set up Node for npm
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Typecheck
        run: bun run typecheck

      # Re-running a workflow must not fail on a version that already shipped.
      - name: Check whether this version is already on npm
        id: npm-check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "Checking ${NAME}@${VERSION}"
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${NAME}@${VERSION} is already published. Nothing to do."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.npm-check.outputs.already != 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Report published version
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "Published ${NAME}@${VERSION} to https://www.npmjs.com/package/${NAME}"
